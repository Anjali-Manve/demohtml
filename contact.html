<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Indore Tourism</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f8ff;
      padding: 50px;
      font-family: 'Segoe UI', sans-serif;
    }

    .contact-form {
      background-color: #ffffff;
      border-radius: 15px;
      padding: 40px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .form-title {
      font-size: 2rem;
      font-weight: bold;
      color: #0056b3;
      margin-bottom: 30px;
      text-align: center;
    }

    .btn-submit {
      background-color: #007bff;
      color: white;
    }

    .btn-submit:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Indore Tourism</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
  
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="palaces.html">Palaces</a></li>
          <li class="nav-item"><a class="nav-link" href="temples.html">Temples</a></li>
          <li class="nav-item"><a class="nav-link" href="food.html">Food Markets</a></li>
          <li class="nav-item"><a class="nav-link" href="famous-markets.html">Famous Markets</a></li>
          <li class="nav-item"><a class="nav-link" href="parks.html">Parks</a></li>
          <li class="nav-item"><a class="nav-link" href="stadiums.html">Stadiums</a></li>
          <li class="nav-item"><a class="nav-link" href="church.html">Church</a></li>
          <li class="nav-item"><a class="nav-link" href="Contact.html">Contact</a>
        </ul>
      </div>
    </div>
  </nav>
  
<div class="container">
  <div class="contact-form">
    <h2 class="form-title">Contact Us</h2>
    <form>
      <div class="mb-3">
        <label for="name" class="form-label">Your Name</label>
        <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Your Email</label>
        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number">
      </div>

      <div class="mb-3">
        <label for="message" class="form-label">Your Message</label>
        <textarea class="form-control" id="message" rows="4" placeholder="Write your message here..." required></textarea>
      </div>

      <button type="submit" class="btn btn-submit">Send Message</button>
    </form>
  </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-light text-center py-3 mt-5">
  &copy; 2025 Indore Tourism | Designed by Anjali
</footer>

</body>
</html>
